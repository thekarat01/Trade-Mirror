[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trademirror"
version = "0.1.0"
description = "Evidence-grounded brokerage activity normalization and reconciliation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trademirror = "trademirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
